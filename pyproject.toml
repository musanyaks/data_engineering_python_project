[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-engineering"
version = "0.1.0"
description = "Production-ready data engineering pipeline framework with Airflow, dbt, Snowflake, and Spark"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Data Engineering Team", email = "team@example.com"},
]
keywords = ["data-engineering", "etl", "pipeline", "airflow", "dbt", "snowflake", "spark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "structlog>=23.0.0",
    "python-json-logger>=2.0.0",
    "tenacity>=8.2.0",
    "snowflake-connector-python>=3.6.0",
    "snowflake-sqlalchemy>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "factory-boy>=3.3.0",
    "faker>=19.0.0",
    "freezegun>=1.2.0",
]
airflow = [
    "apache-airflow>=2.8.0",
    "apache-airflow-providers-celery>=3.6.0",
    "apache-airflow-providers-postgres>=5.10.0",
    "apache-airflow-providers-http>=4.9.0",
    "apache-airflow-providers-snowflake>=5.5.0",
]
dbt = [
    "dbt-core>=1.7.0",
    "dbt-snowflake>=1.7.0",
]
spark = [
    "pyspark>=3.5.0",
]
all = [
    "data-engineering[dev,airflow,dbt,spark]",
]

[project.scripts]
run-pipeline = "scripts.run_pipeline:main"
run-dbt = "scripts.dbt.run_dbt:main"
run-spark = "spark.jobs.process_sales:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_engineering"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "C4", "SIM",
]
ignore = [
    "D100", "D104", "D107",
]

[tool.ruff.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "snowflake.connector.*",
    "snowflake.connector.pandas_tools.*",
    "airflow.*",
    "dbt.*",
    "pyspark.*",
    "pydantic_settings.*",
    "structlog.*",
    "snowflake.*",
    "pyspark.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src/data_engineering",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "snowflake: Snowflake-specific tests",
    "spark: Spark-specific tests",
]

[tool.coverage.run]
source = ["src/data_engineering"]
omit = [
    "*/tests/*",
    "*/test_*",
    "__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
