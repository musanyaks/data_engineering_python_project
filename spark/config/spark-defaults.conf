# Spark configuration optimized for 16GB RAM laptop
# Adjust based on your workload

spark.master                     spark://spark-master:7077
spark.app.name                  DataEngineering

# Memory settings (adjustable via env vars)
spark.driver.memory             ${SPARK_DRIVER_MEMORY:-4g}
spark.executor.memory           ${SPARK_EXECUTOR_MEMORY:-4g}
spark.executor.cores            ${SPARK_EXECUTOR_CORES:-4}

# Performance optimizations
spark.sql.adaptive.enabled      true
spark.sql.adaptive.coalescePartitions.enabled  true
spark.sql.adaptive.skewJoin.enabled            true
spark.serializer                org.apache.spark.serializer.KryoSerializer
spark.sql.shuffle.partitions    ${SPARK_SHUFFLE_PARTITIONS:-8}
spark.default.parallelism       ${SPARK_DEFAULT_PARALLELISM:-8}

# Arrow for fast pandas conversion
spark.sql.execution.arrow.pyspark.enabled      true
spark.sql.execution.arrow.maxRecordsPerBatch   10000

# Storage
spark.sql.files.maxPartitionBytes            128m
spark.sql.files.openCostInBytes              4m

# Local disk for spills (100GB SSD is plenty)
spark.local.dir                 /tmp/spark-temp

# Logging
spark.log.level                 WARN
